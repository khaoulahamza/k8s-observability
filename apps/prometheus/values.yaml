grafana:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.192.168.1.100.nip.io
    paths:
      - /

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - alertmanager.192.168.1.100.nip.io
    paths:
      - /

nodeExporter:
  enabled: true
