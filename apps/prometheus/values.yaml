grafana:
  enabled: false  # On utilise le chart Grafana séparé

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - prometheus.staging.local  # ✅ MetalLB + .local
    paths:
      - /
    pathType: Prefix

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - alertmanager.staging.local  # ✅ MetalLB + .local
    paths:
      - /
    pathType: Prefix

nodeExporter:
  enabled: true
