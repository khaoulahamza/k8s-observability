commonConfig:
  replication_factor: 1

storage:
  type: filesystem

auth_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: false

gateway:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/proxy-buffering: "off"  # ✅ Important pour les logs streamés
    hosts:
      - host: loki.staging.local  # ✅ MetalLB + .local
        paths:
          - path: /
            pathType: Prefix

# ✅ AJOUT CRUCIAL : Promtail pour collecter les logs du cluster
promtail:
  enabled: true
  config:
    clients:
      - url: http://loki-gateway.observability.svc:80/loki/api/v1/push
